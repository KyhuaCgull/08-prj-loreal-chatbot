<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Oréal Beauty Advisor Chatbot</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header / Branding -->
        <header class="site-header">
            <div class="brand-container">
                <img src="loreal-logo.png" alt="L'Oréal Logo" class="logo">
                <div>
                    <h1 class="site-title">L'Oréal Beauty Advisor</h1>
                    <p class="site-subtitle">Your personal guide to makeup, skincare, haircare & fragrances</p>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <main>
            <section class="chatbox">
                <div id="chatWindow" class="chat-window">
                    <!-- Initial welcome message bubble -->
                    <div class="message assistant-message">
                        <div class="message-bubble">
                            Hello! I'm your L'Oréal beauty advisor. How can I help you discover the perfect skincare, makeup, haircare, or fragrance routine today?
                        </div>
                    </div>
                </div>

                <form id="chatForm" class="chat-form">
                    <label for="userInput" class="visually-hidden">Message</label>
                    <input
                        id="userInput"
                        name="userInput"
                        type="text"
                        placeholder="Ask about products, routines, or recommendations…"
                        autocomplete="off"
                        required
                    />
                    <button type="submit" id="sendBtn">
                        <span class="material-icons">send</span>
                        <span class="visually-hidden">Send</span>
                    </button>
                </form>
            </section>
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <p>&copy; 2026 L'Oréal. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
